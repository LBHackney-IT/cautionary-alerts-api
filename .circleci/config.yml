version: 2.1

orbs:
  aws_assume_role: lbh-hackit/aws_assume_role@0.1.1
  aws-cli: circleci/aws-cli@5.1.0

executors:
  docker-python:
    docker:
      - image: cimg/python:3.12
  docker-terraform:
    docker:
      - image: "hashicorp/terraform:0.12.29"


references:
  workspace_root: &workspace_root "~"
  attach_workspace: &attach_workspace
    attach_workspace:
      at: *workspace_root

commands:
  assume-role-and-persist-workspace:
    description: "Assumes deployment role and persists credentials across jobs"
    parameters:
      aws-account:
        type: string
    steps:
      - checkout
      - aws_assume_role/assume_role:
          account: <<parameters.aws-account>>
          profile_name: default
          role: "LBH_Circle_CI_Deployment_Role"
      - persist_to_workspace:
          root: *workspace_root
          paths:
            - .aws
  terraform-preview:
    description: "Initializes and applies terraform configuration"
    parameters:
      environment:
        type: string
    steps:
      - aws-cli/install
      - *attach_workspace
      - checkout
      - run:
          command: |
            cd ./terraform/<<parameters.environment>>/
            terraform get -update=true
            terraform init
          name: get and init
      - run:
          name: install jq
          command: apk add --no-cache jq
      - run:
          name: check for potential dupe conf
          command: |
            echo "checking whether there's a need to set up a rule"
            REGION="us-east-1"

            # Get all rules
            RULES_JSON=$(aws events list-rules --region "$REGION" --output json)

            echo "$RULES_JSON" | jq -r '
              .Rules[] | 
              "Rule Name: \(.Name)\n" +
              "State:     \(.State)\n" +
              "Schedule:  \(.ScheduleExpression // "N/A (Event Driven)")\n" +
              "Description: \(.Description // "No description")\n" +
              "---"
            '
      - run:
          name: plan
          command: |
            cd ./terraform/<<parameters.environment>>/
            terraform plan


jobs:
  assume-role-development:
    executor: docker-python
    steps:
      - assume-role-and-persist-workspace:
          aws-account: $AWS_ACCOUNT_DEVELOPMENT
  assume-role-production:
    executor: docker-python
    steps:
      - assume-role-and-persist-workspace:
          aws-account: $AWS_ACCOUNT_PRODUCTION
  preview-development-terraform:
    executor: docker-terraform
    steps:
      - terraform-preview:
          environment: "development"
  preview-production-terraform:
    executor: docker-terraform
    steps:
      - terraform-preview:
          environment: "production"

workflows:
  feature:
    jobs:
      - assume-role-development:
          context: api-assume-role-development-context
          filters:
            branches:
              only:
                - test-test
      - preview-development-terraform:
          requires:
            - assume-role-development

      - assume-role-production:
          context: api-assume-role-production-context
          filters:
            branches:
              only:
                - test-test
      - preview-production-terraform:
          requires:
            - assume-role-production
